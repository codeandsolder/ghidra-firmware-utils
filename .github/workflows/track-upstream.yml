name: Track upstream

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
    with:
      upstream-repository: al3xtjames/ghidra-firmware-utils
      upstream-branch: master
      target-branch: master
      workflow-policy: preserve
      validation-script: .github/scripts/validate-upstream.sh
      java-version: "21"

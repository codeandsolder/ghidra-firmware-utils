name: Track upstream

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
    with:
      upstream-repository: al3xtjames/ghidra-firmware-utils
      upstream-branch: master
      target-branch: master
      workflow-policy: preserve
      validation-script: .github/scripts/validate-upstream.sh
      java-version: "21"

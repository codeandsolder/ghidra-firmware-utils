name: Shared workflow policy
on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [master]
    paths: [".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    uses: codeandsolder/ci-workflows/.github/workflows/workflow-concurrency.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
